# SGW Next uses UDP for GTPv2-C, PFCP, and GTP-U. Linux doubles the
# SO_RCVBUF/SO_SNDBUF accounting value, so a 16 MiB maximum permits the
# application's requested 16 MiB queue (reported as approximately 32 MiB).
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.netdev_max_backlog = 250000
net.ipv4.udp_rmem_min = 262144
net.ipv4.udp_wmem_min = 262144
# PGW-U routes decapsulated UE IPv4 packets between its kernel GTP device and
# the site's explicitly managed egress path. Site firewall/NAT policy remains
# separate and should default to deny until that path is commissioned.
net.ipv4.ip_forward = 1
# Dedicated bearer uplink packets enter a separate GTP device while the UE
# prefix deliberately remains routed through the default bearer device.
# Strict or loose reverse-path filtering would discard that valid asymmetric
# traffic after TCX policy validation.
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0
